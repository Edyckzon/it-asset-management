<div class="max-w-5xl mx-auto p-4 space-y-5">
  <section class="rounded-2xl border border-gray-200 bg-white p-5 shadow-theme-sm dark:border-gray-800 dark:bg-gray-900">
    <p class="text-sm font-semibold uppercase tracking-wide text-brand-500">Preferencias</p>
    <h1 class="mt-1 text-2xl font-bold text-gray-900 dark:text-white">Configuración del sistema</h1>
    <p class="mt-1 text-sm text-gray-500 dark:text-gray-400">Ajustes locales para trabajar más cómodo. No altera la base de datos ni la data registrada.</p>
  </section>

  <section class="rounded-xl border border-gray-200 bg-white p-5 dark:border-gray-800 dark:bg-gray-900">
    <div class="grid grid-cols-1 gap-5 md:grid-cols-2">
      <label class="block">
        <span class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Tema</span>
        <select [ngModel]="preferences().theme" (ngModelChange)="update('theme', $event)" class="h-10 w-full rounded-lg border border-gray-300 bg-gray-50 px-3 text-sm text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
          <option value="light">Claro</option>
          <option value="dark">Oscuro</option>
        </select>
      </label>

      <label class="block">
        <span class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Moneda por defecto</span>
        <select [ngModel]="preferences().defaultCurrency" (ngModelChange)="update('defaultCurrency', $event)" class="h-10 w-full rounded-lg border border-gray-300 bg-gray-50 px-3 text-sm text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
          <option value="PEN">Soles PEN</option>
          <option value="USD">Dólares USD</option>
        </select>
      </label>

      <label class="block">
        <span class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Tipo de cambio referencial</span>
        <input type="number" step="0.001" min="0" [ngModel]="preferences().exchangeRate" (ngModelChange)="update('exchangeRate', +$event)" class="h-10 w-full rounded-lg border border-gray-300 bg-gray-50 px-3 text-sm text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-white" />
      </label>

      <label class="block">
        <span class="mb-1 block text-sm font-medium text-gray-700 dark:text-gray-300">Filas por página preferidas</span>
        <select [ngModel]="preferences().rowsPerPage" (ngModelChange)="update('rowsPerPage', +$event)" class="h-10 w-full rounded-lg border border-gray-300 bg-gray-50 px-3 text-sm text-gray-800 dark:border-gray-700 dark:bg-gray-800 dark:text-white">
          <option [value]="10">10</option>
          <option [value]="25">25</option>
          <option [value]="50">50</option>
        </select>
      </label>

      <label class="flex items-center justify-between gap-4 rounded-xl border border-gray-200 p-4 dark:border-gray-800 md:col-span-2">
        <span>
          <span class="block text-sm font-semibold text-gray-900 dark:text-white">Modo compacto</span>
          <span class="block text-xs text-gray-500 dark:text-gray-400">Preparado para reducir espaciados en pantallas densas. Se guarda como preferencia local.</span>
        </span>
        <input type="checkbox" [ngModel]="preferences().compactMode" (ngModelChange)="update('compactMode', $event)" class="h-5 w-5 rounded border-gray-300 text-brand-600 focus:ring-brand-500" />
      </label>
    </div>

    <div class="mt-5 flex justify-end gap-3">
      <button type="button" (click)="reset()" class="h-10 rounded-lg border border-gray-200 px-4 text-sm font-semibold text-gray-700 hover:bg-gray-50 dark:border-gray-700 dark:text-gray-300 dark:hover:bg-gray-800">Restablecer</button>
      <button type="button" (click)="save()" class="h-10 rounded-lg bg-brand-500 px-4 text-sm font-semibold text-white hover:bg-brand-600">Guardar cambios</button>
    </div>
  </section>
</div>
